name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          ruff check custom_components tests

  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Минимальная заявленная версия (hacs.json: homeassistant >= 2023.9) —
          # обязательная проверка, что интеграция не сломала обратную совместимость.
          - python-version: "3.11"
            ha-version: "2023.9.0"
            phacc-version: "0.13.54"
          # Свежая версия HA — ловит поломки от изменений API самой Home Assistant
          # (как в issue #4) раньше, чем о них сообщат пользователи. Может падать
          # из-за требований к версии Python/зависимостям на стороне HA — не блокирует
          # мердж (continue-on-error), но сигнал важно видеть.
          - python-version: "3.11"
            ha-version: "latest"
            phacc-version: "latest"

    continue-on-error: ${{ matrix.ha-version == 'latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: .github/workflows/tests.yml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.ha-version }}" = "latest" ]; then
            pip install pytest-homeassistant-custom-component homeassistant
          else
            pip install \
              "pytest-homeassistant-custom-component==${{ matrix.phacc-version }}" \
              "homeassistant==${{ matrix.ha-version }}"
          fi

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/ \
            --cov=custom_components.rosdomofon \
            --cov-report=term-missing